spring:
  application:
    name: seat-reservation
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
      minimum-idle: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
    prometheus:
      access: unrestricted
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  observations:
    key-values:
      application: ${spring.application.name}

app:
  admin-token: ${ADMIN_TOKEN}
  hold-ttl-seconds: ${HOLD_TTL_SECONDS:900}
  per-user-limit-default: ${PER_USER_LIMIT:4}
  expiry-sweep-ms: ${EXPIRY_SWEEP_MS:5000}

logging:
  level:
    root: INFO
    com.paytmassignment: INFO
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} request_id=%X{request_id} user_id=%X{user_id} - %msg%n"
